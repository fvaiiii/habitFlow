services:
  db:
    image: postgres:17.0-alpine3.20
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-habit-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - habitflow

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      ENV: docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - habitflow
    #ports:
    #  - '8080:8080'

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      - back
    ports:
      - '8081:80'
    networks:
      - habitflow

networks:
  habitflow:

volumes:
  postgres-habit-data:
